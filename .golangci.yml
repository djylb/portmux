version: "2"

linters:
  default: all
  disable:
    # Formatting and naming style that gofmt and the code's idiom already
    # settle: blank-line placement, short names in short scopes, the
    # if err := f(); err != nil form, embedded-field spacing.
    - wsl
    - wsl_v5
    - nlreturn
    - varnamelen
    - noinlineerr
    - embeddedstructfieldcheck
    - lll
    # Zero values are ready to use throughout the package; literals name
    # only the fields they set.
    - exhaustruct
    - exhaustruct_v5
    # Functions are ordered by topic, next to the code they serve.
    - funcorder
    # The hot paths are written out in one function on purpose, so that
    # the fast path stays inlined and free of calls; size metrics flag
    # exactly those.
    - cyclop
    - gocognit
    - gocyclo
    - nestif
    - funlen
    - maintidx
    # Tests measure timing and use synctest bubbles; running them in
    # parallel would distort what they measure. Internal tests need the
    # package's unexported state.
    - paralleltest
    - tparallel
    - testpackage
    # The wrappers return the errors of the connections they wrap as they
    # are, so that callers see the same errors as without them.
    - wrapcheck
    # Limiter is the package's interface: constructors and views return it.
    - ireturn
    # Named results document what a function returns.
    - nonamedreturns
    # Package state is deliberate: the configuration lock, shared closed
    # channels and the clock epoch.
    - gochecknoglobals
    # Constants are explained where they are used.
    - mnd
    # Type assertions follow a classification of the Limiter's kind; a
    # mismatch is a bug that must panic.
    - forcetypeassert
    # No import rules: the module has no dependencies.
    - depguard
    # Deprecated, replaced by gomodguard_v2.
    - gomodguard
  settings:
    govet:
      enable-all: true
      disable:
        # Checked on its own, as fieldalignment; what remains are
        # pointer-byte reports, for which fields keep their order of
        # meaning.
        - fieldalignment
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # The RFC 7541 tables are data copied from the specification: their
      # repeated names are the table, and the two Huffman arrays look alike
      # by being arrays of numbers.
      - path: httphead/hpack_tables\.go
        linters:
          - goconst
          - dupl
      # Tests build errors in place, repeat their case names and unpack
      # fixtures they partly ignore; they open files and run the test
      # binary by path.
      - path: (_test\.go|internal/(leakcheck|testutil)/)
        linters:
          - err113
          - goconst
          - dogsled
      - path: _test\.go
        linters:
          - gosec
        text: "G204|G304"
      # Tests dial the loopback listeners they start, with a context that
      # adds nothing; they bind to all interfaces to test that, skip
      # certificate checks against their own self-signed servers, serve
      # without timeouts from servers that live as long as the test, echo
      # what they are sent, draw random inputs and build bytes from small
      # loop counters.
      - path: (_test\.go|internal/testutil/)
        linters:
          - noctx
      - path: (_test\.go|internal/testutil/)
        linters:
          - gosec
        text: "G102|G112|G114|G115|G402|G404|G705"
      # Tests spell status codes, methods and header names as the wire
      # carries them, including the non-canonical forms they send on
      # purpose, and read response bodies that the test server closes with
      # the connection.
      - path: (_test\.go|internal/testutil/)
        linters:
          - usestdlibvars
          - canonicalheader
          - bodyclose
      # Tests append to slices whose sizes do not matter, and their
      # examples print nothing deterministic (ports, timing) or log.Fatal
      # to end the example on a setup failure.
      - path: (_test\.go|internal/testutil/)
        linters:
          - prealloc
      - path: _test\.go
        linters:
          - testableexamples
          - gocritic
          - nilnil
      # Callbacks of a fixed signature ignore what they are given.
      - path: _test\.go
        linters:
          - revive
        text: unused-parameter

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
